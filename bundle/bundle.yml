schema_version: "1.0"

# Guardians - one install for scopeGuard, archiGuard and auditGuard at versions tested together.
# Pins are exact (Spec Kit resolves them through an install-allowed catalog whose entry carries that version).
# After Spec Kit's own default and community catalogs (a project catalog file replaces them; README.md, Install):
#   specify extension catalog add https://raw.githubusercontent.com/rlgdev/spec-kit-guardians/main/catalog/extensions.json --name guardians --priority 10 --install-allowed
#   specify preset catalog add    https://raw.githubusercontent.com/rlgdev/spec-kit-guardians/main/catalog/presets.json    --name guardians --priority 10 --install-allowed
#   specify bundle catalog add    https://raw.githubusercontent.com/rlgdev/spec-kit-guardians/main/catalog/bundles.json    --id guardians
#   specify bundle install guardians
# Then: bash .specify/extensions/guardians/scripts/bash/guardians.sh configure   (or /speckit.guardians.configure)

bundle:
  id: "guardians"
  name: "Guardians"
  version: "0.1.2"
  role: "architect"
  description: "scopeGuard, archiGuard and auditGuard at tested versions, with one configure and one alignment check: scope, architecture and audit-trail governance for the Spec Kit SDLC"
  author: "rlgdev"
  license: "MIT"

requires:
  # 1.0.3: the first Spec Kit whose `bundle install` creates each extension's config from its template; 1.0.1 and 1.0.2
  # leave the configs out, so `guardians configure` has nothing to cross-wire. Their resolver refuses this bundle up front.
  speckit_version: ">=1.0.3"
  tools: ["python>=3.9", "git>=2.20"]
  mcp: []

# No `integration:` block - the bundle adopts the project's active integration.

provides:
  extensions:
    - { id: "scopeguard", version: "0.4.1" }   # scope gates; runs embedded in archiGuard's pipeline
    - { id: "archiguard", version: "0.1.1" }   # architecture gates, edit guard, the scope gate's owner
    - { id: "auditguard", version: "0.1.0" }   # the audit trail of every command, gate report and decision
    - { id: "guardians",  version: "0.1.2" }   # this bundle's configure and verify
  presets:
    # archiGuard's default integration is inline: the preset makes the gates steps of /speckit.plan, /speckit.tasks
    # and /speckit.implement and adds the Architecture Conformance / Scope Coverage / Fitness sections to the templates.
    # `strategy` is required by the bundle schema; the preset's own per-entry strategies apply at install.
    - { id: "archiguard-templates", version: "0.1.1", priority: 10, strategy: "wrap" }
  # No scopeguard-templates (archiGuard wraps the commands and runs the scope gate itself) and no workflows
  # (scopeguard-sdd / archiguard-sdd are for integration: workflow; add them by hand when you use it).

tags: ["governance", "architecture", "scope", "audit", "quality-gate"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the bundle's pins (check-family's ci-refs check requires them to equal bundle/bundle.yml): the test job's auditGuard
  # checkout, the tag the family job fetches, the e2e's clones and the action self-test. A missing tag falls back to
  # main (the family job and the e2e say so); the action self-test is skipped instead, GitHub must resolve its `uses:` tags
  SCOPEGUARD_REF: v0.4.1
  ARCHIGUARD_REF: v0.1.1
  AUDITGUARD_REF: v0.1.0

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml
      - name: auditGuard checkout for the YAML-fallback test
        shell: bash
        run: |
          if git ls-remote --exit-code --tags https://github.com/rlgdev/spec-kit-auditguard "refs/tags/$AUDITGUARD_REF" >/dev/null 2>&1; then
            git clone -q --depth 1 --branch "$AUDITGUARD_REF" https://github.com/rlgdev/spec-kit-auditguard "$RUNNER_TEMP/auditguard"
          else
            git clone -q --depth 1 https://github.com/rlgdev/spec-kit-auditguard "$RUNNER_TEMP/auditguard"
          fi
      - name: pytest
        shell: bash
        run: AUDITGUARD_SRC="$RUNNER_TEMP/auditguard" python -m pytest -q -rs --junitxml=pytest-report.xml
      - name: failing tests as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest-report.xml").getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = ((bad.get("message") or "") + "\n" + (bad.text or ""))[-3000:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyflakes pyyaml
      - run: python -m pyflakes scripts/python tools tests
      - run: shellcheck scripts/bash/guardians.sh tools/e2e-speckit.sh
      - run: python tools/build.py --check
      - run: python tools/check-family.py --help > /dev/null
      - name: the catalogs are valid JSON with the expected ids
        run: |
          python - <<'PY'
          import json
          ext = json.load(open("catalog/extensions.json"))["extensions"]
          assert set(ext) == {"scopeguard", "archiguard", "auditguard", "guardians"}, set(ext)
          assert set(json.load(open("catalog/presets.json"))["presets"]) == {"archiguard-templates"}
          assert set(json.load(open("catalog/bundles.json"))["bundles"]) == {"guardians"}
          print("catalogs ok")
          PY

  family:
    name: family consistency (the four repositories agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml
      - name: the siblings' main branches, with the pinned tag fetched for the fixture comparison
        shell: bash
        run: |
          # main: the launchers, CI refs and READMEs are compared as they are now; the fixtures against the
          # template at the pinned tag (check-family reads it with `git show v<pin>:config-template.yml`)
          for ext in scopeguard archiguard auditguard; do
            ref_var="$(echo "$ext" | tr a-z A-Z)_REF"; ref="${!ref_var}"
            git clone -q --depth 1 "https://github.com/rlgdev/spec-kit-$ext" "$RUNNER_TEMP/$ext"
            git -C "$RUNNER_TEMP/$ext" fetch -q --depth 1 origin "refs/tags/$ref:refs/tags/$ref" 2>/dev/null \
              || echo "::notice title=family check::rlgdev/spec-kit-$ext has no tag $ref yet - the fixture is compared with main"
          done
      - run: python tools/check-family.py --scopeguard-src "$RUNNER_TEMP/scopeguard" --archiguard-src "$RUNNER_TEMP/archiguard" --auditguard-src "$RUNNER_TEMP/auditguard"

  launchers:
    name: launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: bash launcher
        shell: bash
        run: |
          bash scripts/bash/guardians.sh version | grep -q "Guardians 0."
          set +e; bash scripts/bash/guardians.sh verify; code=$?; set -e
          test "$code" -eq 2   # no Spec Kit project here
      - name: PowerShell launcher
        shell: pwsh
        run: |
          $out = & ./scripts/powershell/guardians.ps1 version
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch 'Guardians 0\.') { throw "version failed: $out" }
          & ./scripts/powershell/guardians.ps1 verify
          if ($LASTEXITCODE -ne 2) { throw "verify outside a project must exit 2, got $LASTEXITCODE" }
          exit 0

  spec-kit:
    name: e2e against Spec Kit (${{ matrix.speckit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        speckit: ["specify-cli", "specify-cli==1.0.3"]   # 1.0.3: the bundle's floor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "${{ matrix.speckit }}"
      - run: bash tools/e2e-speckit.sh

  floor:
    name: Spec Kit 1.0.2 refuses the bundle (floor 1.0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "specify-cli==1.0.2"
      - name: bundle install must stop before installing anything
        run: |
          # 1.0.1 and 1.0.2 do not create the extensions' config files on `bundle install`; the floor keeps them out
          cd "$RUNNER_TEMP" && specify init lab --integration claude --script sh --ignore-agent-tools --non-interactive >/dev/null
          cd lab
          if out=$(specify bundle install "$GITHUB_WORKSPACE/bundle/bundle.yml" --offline 2>&1); then
            echo "$out"; echo "::error::Spec Kit 1.0.2 installed the bundle"; exit 1
          fi
          echo "$out"
          echo "$out" | tr -s ' \n' ' ' | grep -q "requires Spec Kit >=1.0.3"
          test ! -d .specify/extensions/guardians

  action:
    name: GitHub Action self-test (guardians verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install specify-cli pyyaml
      - name: are the sibling actions released at the bundle's pins?
        id: pins
        shell: bash
        run: |
          # GitHub resolves every `uses:` of a composite action before it runs, so the self-test needs the tags to exist
          ready=true
          for ext in scopeguard archiguard auditguard; do
            ref_var="$(echo "$ext" | tr a-z A-Z)_REF"; ref="${!ref_var}"
            if ! git ls-remote --exit-code --tags "https://github.com/rlgdev/spec-kit-$ext" "refs/tags/$ref" >/dev/null 2>&1; then
              echo "::notice title=action self-test skipped::rlgdev/spec-kit-$ext has no tag $ref yet; the composite action cannot resolve it"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: a configured lab project
        if: steps.pins.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for ext in scopeguard archiguard auditguard; do
            ref_var="$(echo "$ext" | tr a-z A-Z)_REF"; ref="${!ref_var}"
            if git ls-remote --exit-code --tags "https://github.com/rlgdev/spec-kit-$ext" "refs/tags/$ref" >/dev/null 2>&1; then
              git -c advice.detachedHead=false clone -q --depth 1 --branch "$ref" "https://github.com/rlgdev/spec-kit-$ext" "$RUNNER_TEMP/$ext"
            else
              git clone -q --depth 1 "https://github.com/rlgdev/spec-kit-$ext" "$RUNNER_TEMP/$ext"
            fi
          done
          cd "$RUNNER_TEMP"
          specify init lab --integration claude --script sh --ignore-agent-tools --non-interactive >/dev/null
          cd lab
          for dir in "$RUNNER_TEMP/scopeguard" "$RUNNER_TEMP/archiguard" "$RUNNER_TEMP/auditguard" "$GITHUB_WORKSPACE"; do
            printf 'y\ny\ny\n' | specify extension add --dev "$dir" >/dev/null
          done
          printf 'y\n' | specify preset add --dev "$RUNNER_TEMP/archiguard/preset" >/dev/null
          git init -q -b main && git config user.email ci@example.com && git config user.name ci
          bash .specify/extensions/guardians/scripts/bash/guardians.sh configure
      - name: verify the lab (passes)
        if: steps.pins.outputs.ready == 'true'
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/lab
          scopeguard: "false"
          archiguard: "false"
          auditguard: "false"
      - name: make the base branches disagree
        if: steps.pins.outputs.ready == 'true'
        run: |
          sed -i 's/^    base: main/    base: develop/' "$RUNNER_TEMP/lab/.specify/extensions/auditguard/auditguard-config.yml"
      - name: verify again (must fail)
        if: steps.pins.outputs.ready == 'true'
        id: tampered
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/lab
          scopeguard: "false"
          archiguard: "false"
          auditguard: "false"
      - if: steps.pins.outputs.ready == 'true'
        run: test "${{ steps.tampered.outcome }}" = "failure"
